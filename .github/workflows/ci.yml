name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Validates content frontmatter against the schemas in src/content.config.ts.
      # A malformed blog/team/paper entry fails here, blocking the merge.
      - name: Type & content check
        run: npx astro check
      - name: Build
        run: npm run build
